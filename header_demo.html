<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Institution Header</title>
<!-- Modern Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
  /* --- THEME VARIABLES --- */
  :root {
    --header-bg: #ffffff;
    --text-primary: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --transition-speed: 0.3s;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }

  [data-theme="dark"] {
    --header-bg: #0D1117;
    --text-primary: #f8fafc;
    --text-muted: #9ca3af;
    --border-color: #1f2937;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  }

  /* --- GLOBAL RESETS --- */
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--header-bg);
    color: var(--text-primary);
    transition: background-color var(--transition-speed), color var(--transition-speed);
  }

  /* --- HEADER LAYOUT --- */
  .institution-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background-color: var(--header-bg);
    border-bottom: 1px solid var(--border-color);
    box-shadow: var(--shadow);
    transition: background-color var(--transition-speed), border-color var(--transition-speed), box-shadow var(--transition-speed);
  }

  .header-col-left, .header-col-right {
    flex: 0 0 120px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .header-col-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 20px;
  }

  /* --- TYPOGRAPHY --- */
  .society-name {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 4px 0;
    color: var(--text-primary);
  }

  .college-name {
    font-size: 1.8rem;
    font-weight: 800;
    margin: 0 0 6px 0;
    letter-spacing: 0.25px;
    color: var(--text-primary);
  }

  .affiliation-info {
    font-size: 0.95rem;
    font-style: italic;
    font-weight: 400;
    margin: 0 0 4px 0;
    color: var(--text-primary);
  }

  .accreditation-info {
    font-size: 0.85rem;
    font-style: italic;
    font-weight: 400;
    color: var(--text-muted);
    margin: 0;
  }

  /* --- IMAGES --- */
  .header-logo {
    width: 100%;
    max-width: 110px;
    height: auto;
    object-fit: contain;
  }

  /* --- DEMO THEME TOGGLE (Optional UI) --- */
  .theme-toggle-wrapper {
    position: absolute;
    top: 15px;
    right: 20px;
    z-index: 100;
  }

  .theme-toggle {
    background: var(--text-primary);
    color: var(--header-bg);
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .theme-toggle:hover {
    opacity: 0.8;
  }

  /* --- RESPONSIVENESS --- */
  @media (max-width: 768px) {
    .institution-header {
      flex-direction: column;
      text-align: center;
      gap: 15px;
      padding: 25px 15px;
    }

    .header-col-left, .header-col-right {
      flex: 1;
      width: 100%;
    }

    .header-logo {
      max-width: 80px; /* slightly smaller on mobile */
    }

    .college-name {
      font-size: 1.25rem;
    }
    
    .society-name {
      font-size: 0.9rem;
    }
    
    .affiliation-info {
      font-size: 0.85rem;
    }
    
    .accreditation-info {
      font-size: 0.75rem;
    }
  }
</style>
</head>
<body>

<div class="theme-toggle-wrapper">
  <button id="themeToggleBtn" class="theme-toggle">Toggle Theme</button>
</div>

<header class="institution-header">
  <!-- Left Column: Institution Logo -->
  <div class="header-col-left">
    <img src="path/to/zes-logo.png" alt="ZCOER Logo" class="header-logo">
  </div>
  
  <!-- Center Column: Text Hierarchy -->
  <div class="header-col-center">
    <div class="society-name">Zeal Education Society's</div>
    <div class="college-name">ZEAL COLLEGE OF ENGINEERING & RESEARCH, PUNE</div>
    <div class="affiliation-info">An Autonomous Institute affiliated to Savitribai Phule Pune University</div>
    <div class="accreditation-info">ISO:21001:2018 (EoMS) Certified Institute | Accredited with 'A+' Grade by NAAC</div>
  </div>
  
  <!-- Right Column: Accreditation Logo -->
  <div class="header-col-right">
    <img src="path/to/naac-logo.png" alt="NAAC A+ Logo" class="header-logo">
  </div>
</header>

<script>
  /**
   * Theme toggling logic
   */
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const htmlEl = document.documentElement;
  
  // 1. Initialize theme from localStorage or fallback to system preference
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) {
    htmlEl.setAttribute('data-theme', savedTheme);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    htmlEl.setAttribute('data-theme', 'dark');
  }

  // 2. Toggle theme on button click and persist state
  themeToggleBtn.addEventListener('click', () => {
    const currentTheme = htmlEl.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    htmlEl.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>

</body>
</html>
